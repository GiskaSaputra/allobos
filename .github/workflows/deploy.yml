name: Deploy

on:
  workflow_run:
    workflows: [Tes]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  vps:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: produksi
    steps:
      # ssh biasa tanpa aksi pihak ketiga. known_hosts dikunci dari secret supaya server tidak bisa dipalsukan.
      - name: Tarik kode dan bangun ulang wadah di VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          APP_PATH: ${{ secrets.VPS_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "set -e; cd '$APP_PATH'; git pull --ff-only origin main; docker compose up -d --build; docker image prune -f"
