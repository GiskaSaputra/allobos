x-app: &app
  image: allobos-app
  pull_policy: never
  env_file: .env
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
  volumes:
    - storage:/var/www/html/storage/app
    - logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    build: .
    environment:
      CONTAINER_ROLE: app
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:80"

  queue:
    <<: *app
    depends_on:
      app:
        condition: service_started
    environment:
      CONTAINER_ROLE: queue
      DB_HOST: mysql
      DB_PORT: 3306

  scheduler:
    <<: *app
    depends_on:
      app:
        condition: service_started
    environment:
      CONTAINER_ROLE: scheduler
      DB_HOST: mysql
      DB_PORT: 3306

  # Jaringan blockchain uji milik sendiri (Anvil). Hanya bisa dijangkau dari dalam jaringan Docker.
  # Keadaan rantai disimpan ke volume tiap 30 detik dan saat berhenti, jadi sertifikat tetap tercatat walau server dinyalakan ulang.
  chain:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--state", "/data/anvil-state.json", "--state-interval", "30", "--silent"]
    user: root
    volumes:
      - chain:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-allobos}
      MYSQL_USER: ${DB_USERNAME:-allobos}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mysql:
  storage:
  logs:
  chain:
