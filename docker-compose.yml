x-app: &app
  build: .
  image: allobos-app
  env_file: .env
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
  volumes:
    - storage:/var/www/html/storage/app
    - logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: app
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${APP_PORT:-8080}:80"

  queue:
    <<: *app
    environment:
      CONTAINER_ROLE: queue
      DB_HOST: mysql
      DB_PORT: 3306

  scheduler:
    <<: *app
    environment:
      CONTAINER_ROLE: scheduler
      DB_HOST: mysql
      DB_PORT: 3306

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-allobos}
      MYSQL_USER: ${DB_USERNAME:-allobos}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mysql:
  storage:
  logs:
